# Half two: the privileged one.
#
# Two ways in, because they have different fork behaviour:
#
#   workflow_run   — relayed from `lgtm-collect.yml`, which is how an approval
#                    reaches us at all on a fork PR (that event gets no secrets
#                    of its own).
#   issue_comment  — direct. This event DOES carry secrets and a write token on
#                    fork PRs, so answering a quiz, waiving, and @lgtm mentions
#                    need no relay.
#
# ⚠️  This job holds secrets and a write token while handling data that a fork
# author controls. It MUST NOT check out or execute anything from the fork. The
# only inputs are the event payload and the diff, both read as data. Do not add
# `actions/checkout` with a fork ref to this file.
name: LGTM

on:
  workflow_run:
    workflows: [LGTM (collect)]
    types: [completed]
  issue_comment:
    types: [created, edited]

# Declaring this block sets every scope NOT listed to `none` — including
# `contents`, without which even actions/checkout cannot read this repository.
# Each line below is load-bearing; none is a default.
permissions:
  contents: read # check out this repo (never the fork)
  checks: write # post the review-confirmed check
  issues: write # the quiz comment, replies, reactions
  pull-requests: write # read the diff; react to and reply on PR comments
  actions: read # download the relayed event artifact

jobs:
  lgtm:
    # Only comments on pull requests, and only our own quiz or a command —
    # every other comment on every PR would otherwise spin a runner.
    if: >
      github.event_name == 'workflow_run' ||
      (github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, 'lgtm:v1') ||
        contains(github.event.comment.body, '/lgtm waive') ||
        contains(github.event.comment.body, '@lgtm')))
    runs-on: ubuntu-latest
    steps:
      # Checks out THIS repository at the default branch — never the fork's
      # code. On the issue_comment path that is what GitHub gives us anyway; on
      # the workflow_run path it is the security property the whole design
      # rests on.
      #
      # Still needed even though the action below is published: `uses: ./` runs
      # the action from this checkout, which is what dogfoods the same package
      # every consumer gets. A consuming repository needs no checkout at all.
      - uses: actions/checkout@v7

      - name: Fetch the relayed event
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: lgtm-event
          path: relay
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `uses: ./` rather than `sparepartslabs/spareparts-lgtm@v1`: this repo
      # runs the action as it stands on the default branch, so a change is
      # exercised here before it is ever tagged for anyone else.
      - name: Run LGTM
        uses: ./
        with:
          # Whichever vendors this repo has set up. `provider:` in
          # .github/lgtm.yml picks between them, defaulting to Anthropic; a
          # provider named without its key is a neutral check, never a block.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          seal-key: ${{ secrets.LGTM_SEAL_KEY }}
          # Set only on the relay path; its presence is what tells the entry
          # point to read the artifact instead of GitHub's own event file.
          relayed-event: ${{ github.event_name == 'workflow_run' && 'relay/event.json' || '' }}
