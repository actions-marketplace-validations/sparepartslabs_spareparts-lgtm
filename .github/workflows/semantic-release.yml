name: Semantic release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the tested revision is still current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "A newer main revision superseded this test run; its workflow will release instead."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: pip install "commitizen>=4,<5"

      - name: Create the next semantic version tag
        id: version
        shell: bash
        run: |
          set +e
          OUTPUT=$(cz bump --get-next 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 3 ] || [ "$STATUS" -eq 21 ]; then
            echo "No release-worthy conventional commits since the last tag."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTPUT"
            exit "$STATUS"
          fi

          NEXT_VERSION=$(printf '%s\n' "$OUTPUT" | tail -n 1)
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Commitizen returned an invalid version: $NEXT_VERSION"
            exit 1
          fi

          TAG="v${NEXT_VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Tag pushes made with GITHUB_TOKEN do not recursively start workflows.
      - name: Package and publish the plugin
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release-plugin.yml --ref main -f tag="$TAG"
