name: Publish LGTM release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run plugin:validate
      - name: Package marketplace
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run plugin:package -- --version "${TAG#v}" --output release
      - name: Validate archive members
        run: |
          archive=$(find release -name '*.tar.gz' -type f -print -quit)
          test -n "$archive"
          tar -tzf "$archive" | awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.($|\/)/ { bad=1 } END { exit bad }'
      - name: Resolve release range
        id: release-range
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/resolve-release-range.sh "$TAG" "$GITHUB_OUTPUT"
      - name: Resolve changelog object key
        id: changelog-object
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Assume changelog publisher role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CHANGELOG_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Render end-user release notes
        id: changelog
        uses: sparepartslabs/spareparts-changelog@v0
        with:
          provider: anthropic
          instructions: ${{ vars.CHANGELOG_INSTRUCTIONS }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          from: ${{ steps.release-range.outputs.from }}
          to: ${{ steps.release-range.outputs.to }}
          title: ${{ inputs.tag || github.ref_name }}
          write-repository: "false"
          publish-s3: "true"
          s3-bucket: ${{ vars.CHANGELOG_S3_BUCKET }}
          s3-key: releases/spareparts-lgtm/${{ steps.changelog-object.outputs.version }}.md
          s3-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          publish-linkedin: "false"
      - name: Write canonical release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.markdown }}
        run: |
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release/release-notes.md
          files: |
            release/*.tar.gz
            release/*.sha256
