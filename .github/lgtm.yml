# LGTM's own configuration, and the documented example.
# Every field is optional; these are the defaults.

# How many questions to ask. 1–5.
questions: 2

# easy   — distractors are obviously unrelated
# medium — distractors are true about the diff but don't answer the question
# hard   — distractors are the plausible misreading
difficulty: medium

# Who writes the questions: anthropic, openai or gemini, optionally
# vendor:model. Defaults to anthropic. Whichever you name has to have its key
# set as a secret; all three can also search the web, which is what
# surfaceReading and webConcepts below need.
# provider: anthropic

# Who tries to refute them. Defaults to the proposer. Naming a different vendor
# is a stronger check than a model marking its own work.
# verifier: openai

# List the docs and links a reviewer needs, above the questions.
surfaceReading: true

# Also link out to explainers for concepts the diff assumes you know.
# Uses web search. Ignored when surfaceReading is off.
webConcepts: true

# Let reviewers ask questions by mentioning @lgtm in a PR comment.
answerQuestions: true

# Off means the check is reported but never holds a merge. Turning it on also
# requires marking "LGTM — review confirmed" as a required check in branch
# protection — LGTM cannot and will not do that for you.
enforce: false

# Never quizzed about. Generated files (lockfiles, dist/, snapshots) are
# already excluded without being listed.
exemptPaths: []

# Never quizzed. Bots are always exempt regardless.
exemptReviewers: []
